description: >-
  An FMS pulse with peak magnetic amplitude δB/B₀ = 0.3 travels along +x
  through 40 weak Alfvén-wave pairs, each wave at 0.005 B₀, with the guide
  field along +z. The magnetic pulse and seed pattern are shared.
  MHD has cold magnetization 10 and plasma beta 0.1; FFE neglects matter inertia;
  PIC follows a pair plasma with input starvation parameter 0.5.
